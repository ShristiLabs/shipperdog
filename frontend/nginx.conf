# Console nginx (issue #12): static SPA plus same-origin proxying to
# the api service. The client calls /api/... unconditionally; dev uses
# the Vite proxy, compose uses this.
#
# Hardened since issue #39 (S8-05): the portal story's security-header
# set applies here too — the console is the operators' public surface,
# and gzip_proxied finally compresses the proxied API JSON (the gzip
# default excludes proxied responses).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The security-header set (issue #39); /assets/ repeats the
    # include because its own add_header cancels inheritance.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # Static assets are content-hashed; cache hard, fall back to the
    # SPA entry for client-side routes.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets its own security headers (S8-05's backend leg);
        # this marker add_header also cancels the SPA set's inheritance
        # on proxied responses so nothing is doubled.
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
