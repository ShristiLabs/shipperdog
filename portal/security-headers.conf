# Portal security headers (issue #39, S8-05): the full
# securityheaders.com-grade set, as an include so the /assets/
# location — whose own Cache-Control add_header cancels server-level
# inheritance — repeats the set verbatim. CSP is strict-real: the
# portal bundle ships no inline script (Vite module graph), MUI
# injects <style> elements at runtime (style-src 'unsafe-inline'),
# and every fetch is same-origin (/api proxy).
#
# ALWAYS so error responses (404 SPA fallbacks) carry the set too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
