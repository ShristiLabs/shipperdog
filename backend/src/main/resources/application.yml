spring:
  application:
    name: ${SPRING_APPLICATION_NAME:shipperdog-api}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shipperdog}
    username: ${DATABASE_USERNAME:shipperdog}
    password: ${DATABASE_PASSWORD:shipperdog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      # The decision-input cache's store (issue #32, S7-03): the grant
      # set per tester x tenant, membership effectiveness, and tenant
      # application visibility. Timeouts are deliberately tight — the
      # decision path must fail over to direct evaluation in
      # milliseconds, never wait on a struggling Redis (the PRD 42
      # under-100 ms SLO holds with a healthy cache; a degraded cache
      # is correct-but-slower by design, the story's AC3).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:200ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  servlet:
    multipart:
      # Artifact upload headroom (issue #20, S5-01): file parts buffer
      # to disk past the servlet threshold, so a multi-hundred-MB
      # upload never sits in heap. The precise artifact limit stays
      # with the artifact module (ARTIFACT_MAX_UPLOAD_BYTES, which
      # answers the exact 413); these caps only keep the servlet
      # layer from rejecting the body before the module can answer.
      max-file-size: ${ARTIFACT_MULTIPART_MAX_FILE_SIZE:2560MB}
      max-request-size: ${ARTIFACT_MULTIPART_MAX_REQUEST_SIZE:2560MB}

# OpenAPI contract surface (issue #8): generated from code by springdoc,
# snapshotted at build time by the export test, and diffed against the
# committed baseline (docs/openapi/baseline.yaml) in CI so breaking
# changes fail the build. Payload conventions are fixed platform-wide:
# ISO-8601 UTC timestamps and UPPER_SNAKE enum values (Jackson 3
# defaults, enforced by tests).
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}

shipperdog:
  openapi:
    # Deterministic contract metadata: the advertised server is the
    # canonical public endpoint, so builds never diff on a random host.
    server-url: ${OPENAPI_SERVER_URL:https://api.shipperdog.dev}
    version: ${OPENAPI_INFO_VERSION:0.1.0}
  auth:
    # HMAC-SHA256 signing key for JWTs. No committed default: the
    # application refuses to start when blank or shorter than 32 bytes.
    # Local development supplies it via docker compose (.env); production
    # supplies a high-entropy secret from its secret manager (PRD 25).
    jwt-secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:shipperdog-api}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
    lockout-threshold: ${AUTH_LOCKOUT_THRESHOLD:5}
    lockout-duration: ${AUTH_LOCKOUT_DURATION:PT15M}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:PT30M}
    invitation-ttl: ${AUTH_INVITATION_TTL:P3D}
  artifact:
    # Object storage (issue #20, S5-01, FR-007/PRD 24, ADR-0003):
    # binaries live in object storage under the PRD 24 layout,
    # metadata in PostgreSQL. One client serves both targets: when
    # the emulator host is set (local/CI, the compose GCS emulator)
    # the GCS client talks to it without credentials; when blank it
    # uses application default credentials against real GCS.
    storage:
      bucket: ${ARTIFACT_STORAGE_BUCKET:shipperdog-artifacts-local}
      host: ${ARTIFACT_STORAGE_EMULATOR_HOST:}
      project-id: ${ARTIFACT_STORAGE_PROJECT_ID:shipperdog-local}
      create-bucket-if-absent: ${ARTIFACT_STORAGE_CREATE_BUCKET:true}
    upload:
      # The platform-wide artifact ceiling (413 beyond it, on both the
      # multipart and the resumable-session paths), and the size above
      # which the multipart path is refused in favor of a short-lived
      # direct-to-storage upload session (the story's >100 MB rule).
      max-bytes: ${ARTIFACT_MAX_UPLOAD_BYTES:2147483648}
      resumable-threshold-bytes: ${ARTIFACT_RESUMABLE_THRESHOLD_BYTES:104857600}
      session-ttl: ${ARTIFACT_UPLOAD_SESSION_TTL:PT10M}
    # The download tier (issue #38, S8-04, FR-014): signed-URL issuance
    # for tester downloads. The TTL is bounded twice at startup, both
    # fail-fast: at or under the authorization decision-input cache TTL
    # (the S7-04 rule — write-through invalidation makes revocation
    # immediate in the healthy path, and the cache TTL is the
    # degraded-mode backstop a minted URL must never outlive; both
    # default 15 minutes) and at or under FR-014's hard 15-minute
    # ceiling. The proxy key backs the emulator-mode proxy URL (the
    # ADR-0003 download-tier amendment; unused in production, where GCS
    # V4 signing is the mechanism) — the local default is a dev-only
    # value exactly like the JWT secret's local default; production
    # supplies a real secret through the environment.
    download:
      url-ttl: ${ARTIFACT_DOWNLOAD_URL_TTL:PT15M}
      proxy-signing-key: ${ARTIFACT_DOWNLOAD_PROXY_SIGNING_KEY:shipperdog-local-download-key}
    # Metadata extraction (issue #21, S5-02, FR-005): parsing runs
    # async post-upload on a bounded executor — a full queue refuses
    # loudly (the artifact's extraction_error records it) instead of
    # accepting unbounded backlog, storage hiccups retry a bounded
    # number of times, and the per-entry cap keeps a zip bomb from
    # becoming an allocation.
    extraction:
      concurrency: ${ARTIFACT_EXTRACTION_CONCURRENCY:2}
      queue-capacity: ${ARTIFACT_EXTRACTION_QUEUE_CAPACITY:200}
      max-entry-bytes: ${ARTIFACT_EXTRACTION_MAX_ENTRY_BYTES:16777216}
      storage-retry-attempts: ${ARTIFACT_EXTRACTION_STORAGE_RETRIES:3}
    # Validation pipeline (issue #24, S5-05, FR-006): the seven-stage
    # gate between upload and READY runs on its own bounded executor —
    # separate from the extraction pool because the extraction job's
    # settled phase is what schedules it (a shared queue would
    # self-deadlock the hand-off). A full queue refuses loudly (the
    # validation document records VALIDATION_QUEUE_FULL, the artifact
    # stays VALIDATING), and storage hiccups retry a bounded number of
    # times before the attempt records VALIDATION_UNAVAILABLE.
    validation:
      concurrency: ${ARTIFACT_VALIDATION_CONCURRENCY:2}
      queue-capacity: ${ARTIFACT_VALIDATION_QUEUE_CAPACITY:200}
      storage-retry-attempts: ${ARTIFACT_VALIDATION_STORAGE_RETRIES:3}
  feedback:
    # The feedback module's attachment tier (issue #46, S11-01,
    # FR-027/PRD 8.13): bytes in object storage under the
    # tenant-scoped prefix {organizationId}/{submitterTenantId}/
    # feedback/..., metadata in PostgreSQL. The same two-target shape
    # as the artifact store — emulator host set (local/CI) talks to
    # the compose GCS emulator without credentials; blank uses
    # application default credentials against real GCS — deliberately
    # its own client and bucket namespace, one module one store.
    # The limits are AC3's "up to configured limits": per-kind byte
    # ceilings for PRD 8.13's three attachment classes and the
    # per-report file-count bound (an abuse bound on a surface any
    # linked tester may write).
    storage:
      bucket: ${FEEDBACK_STORAGE_BUCKET:shipperdog-feedback-local}
      host: ${FEEDBACK_STORAGE_EMULATOR_HOST:}
      project-id: ${FEEDBACK_STORAGE_PROJECT_ID:shipperdog-local}
      create-bucket-if-absent: ${FEEDBACK_STORAGE_CREATE_BUCKET:true}
      max-screenshot-bytes: ${FEEDBACK_MAX_SCREENSHOT_BYTES:10485760}
      max-video-bytes: ${FEEDBACK_MAX_VIDEO_BYTES:104857600}
      max-log-bytes: ${FEEDBACK_MAX_LOG_BYTES:5242880}
      max-attachments-per-report: ${FEEDBACK_MAX_ATTACHMENTS:5}
  # Release analytics (issue #49, S11-04, FR-029): the hourly rollup
  # job — the platform's first background schedule — recomputes the
  # trailing lookback from source (the late-event healing bound; older
  # history is repaired through the recompute trigger), and the query
  # windows carry hard bounds (an unbounded scan is refused, never
  # clamped). Tests and CI drive the computation through the trigger
  # route, not the clock.
  analytics:
    rollup:
      enabled: ${ANALYTICS_ROLLUP_ENABLED:true}
      cron: ${ANALYTICS_ROLLUP_CRON:0 0 * * * *}
      lookback: ${ANALYTICS_ROLLUP_LOOKBACK:PT24H}
    max-series-window: ${ANALYTICS_MAX_SERIES_WINDOW:P366D}
    max-hourly-span: ${ANALYTICS_MAX_HOURLY_SPAN:P31D}
  # The domain-event bus and notification service (issue #51, S12-01,
  # FR-023, PRD 51): the transactional-outbox relay's schedule and
  # ceilings, and the delivery retry policy every channel shares
  # (exponential backoff off the base; the webhook POST budget).
  # Tests and CI drive the drain through the bean directly with the
  # schedule disabled, the rollup-scheduler pattern.
  notifications:
    relay-enabled: ${NOTIFICATIONS_RELAY_ENABLED:true}
    relay-fixed-delay: ${NOTIFICATIONS_RELAY_FIXED_DELAY:PT2S}
    relay-batch-size: ${NOTIFICATIONS_RELAY_BATCH_SIZE:100}
    relay-max-attempts: ${NOTIFICATIONS_RELAY_MAX_ATTEMPTS:5}
    relay-backoff: ${NOTIFICATIONS_RELAY_BACKOFF:PT2S}
    delivery-max-attempts: ${NOTIFICATIONS_DELIVERY_MAX_ATTEMPTS:5}
    delivery-backoff: ${NOTIFICATIONS_DELIVERY_BACKOFF:PT2S}
    webhook-timeout: ${NOTIFICATIONS_WEBHOOK_TIMEOUT:PT5S}
    # The webhook target policy's test/dev escape hatch: skip the
    # host and DNS checks (the SSRF posture) so local receivers and
    # fixture hosts are acceptable. Production keeps the default
    # (false -- publicly routable http(s) targets only).
    webhook-allow-private-addresses: ${NOTIFICATIONS_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:false}
    # The console's externally reachable origin (S12-02): the deep
    # links inside Slack and Teams messages are built on it. A
    # production deployment sets its real origin; the default is the
    # local compose stack's console.
    console-base-url: ${CONSOLE_BASE_URL:http://localhost:5173}
  # Inbound webhook receivers (issue #53, S12-03, extended issue #54,
  # S12-04, FR-022): the generic framework's knobs -- per-provider
  # credential LISTS (rotation is overlap: every entry stays accepted
  # until removed), the timestamp-window replay seam for providers
  # that stamp their deliveries (the S12-04 receivers all do; GitHub
  # sends none, so the window never applies to it), and the body
  # ceiling every inbound delivery passes before it is parsed (and,
  # since S12-04, before its bytes are even buffered -- the
  # bounded-read filter checks the declared Content-Length). The
  # credentials have no committed default -- an unset credential
  # rejects every delivery with the family's uniform rejection (the
  # receiver is off until an operator configures it), and no secret
  # ever lands in a committed file.
  webhooks:
    # Comma-separated HMAC-SHA256 secrets for POST /webhooks/github
    # (the GitHub webhook's shared secret; see docs/ci.md).
    github-secrets: ${WEBHOOKS_GITHUB_SECRETS:}
    # Comma-separated HMAC-SHA256 secrets for POST /webhooks/jenkins
    # (the receiver-defined signature contract's shared secret; see
    # docs/ci-jenkins.md for the Jenkinsfile one-liner).
    jenkins-secrets: ${WEBHOOKS_JENKINS_SECRETS:}
    # Comma-separated tokens for POST /webhooks/gitlab (the webhook
    # token configured in GitLab; the transport must be TLS because
    # GitLab signs nothing).
    gitlab-secrets: ${WEBHOOKS_GITLAB_SECRETS:}
    # Comma-separated bundle ids POST /webhooks/appstore maps (the
    # authorization leg after Apple's JWS authenticity; a foreign
    # bundle is acknowledged and ignored).
    appstore-bundle-ids: ${WEBHOOKS_APPSTORE_BUNDLE_IDS:}
    # The trusted root certificates for the App Store JWS x5c chain
    # (public roots, not secrets; Apple Root CA G3 by default).
    appstore-trusted-roots: ${WEBHOOKS_APPSTORE_TRUSTED_ROOTS:classpath:webhooks/apple-root-ca-g3.cer}
    # The required OIDC audience for POST /webhooks/google-play (the
    # push subscription's minted-token audience -- this endpoint's
    # URL); empty keeps the receiver off.
    google-play-audience: ${WEBHOOKS_GOOGLE_PLAY_AUDIENCE:}
    # Optional comma-separated service-account emails the same token
    # must carry (the push subscription's identity); empty accepts
    # any Google-signed token with the right audience.
    google-play-trusted-emails: ${WEBHOOKS_GOOGLE_PLAY_TRUSTED_EMAILS:}
    # Where Google's public signing keys are fetched from (cached;
    # overridable so deployments can pin a mirror).
    google-play-jwks-uri: ${WEBHOOKS_GOOGLE_PLAY_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    max-timestamp-skew: ${WEBHOOKS_MAX_TIMESTAMP_SKEW:PT5M}
    max-body-bytes: ${WEBHOOKS_MAX_BODY_BYTES:26214400}
  tester:
    # Tester onboarding (issue #26, S6-01): invitations reuse the
    # identity machinery but carry their own TTL (the issue's 7-day
    # default; the platform invitation TTL above stays 3 days). The
    # portal base URL prefixes the accept link in the invitation
    # email; the portal ships on its own origin (issue #35), distinct
    # from the console's 5173.
    invitation-ttl: ${TESTER_INVITATION_TTL:P7D}
    portal-base-url: ${TESTER_PORTAL_BASE_URL:http://localhost:5174}
    # Default tester groups seeded on every tenant creation (issue #27,
    # S6-02, PRD 8.9's examples; the seeded rows are ordinary editable
    # groups). Comma-separated; empty skips seeding.
    default-groups: ${TESTER_DEFAULT_GROUPS:Internal QA,Tenant QA,UAT,Pilot,Executive Beta,External Beta}
  # In-app request rate limiting (issue #39, S8-05): per-(rule,
  # client-IP) token buckets over the login door and the download
  # tier, answered 429 RATE_LIMITED with a Retry-After header. The
  # defaults are production-tight (10 login attempts/min, 30
  # downloads/min per client); the compose stack overrides them
  # generously because one operator IP carries every browser, e2e
  # run, and CLI session locally, and Cloud Run sets its own through
  # the same variables. Buckets are per-instance (the gateway fronts
  # production); the limiter fails OPEN — it must never be the outage.
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # How many proxies in front of the API append to X-Forwarded-For
    # and are trusted (compose nginx / the Cloud Run fronting proxy
    # both append the real client as the trusted-side entry).
    trusted-proxy-count: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:1}
    # LRU bound on the (rule, client) bucket cache.
    max-tracked-clients: ${RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}
    rules:
      login:
        capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
        refill: ${RATE_LIMIT_LOGIN_REFILL:PT6S}
      downloads:
        capacity: ${RATE_LIMIT_DOWNLOADS_CAPACITY:30}
        refill: ${RATE_LIMIT_DOWNLOADS_REFILL:PT2S}
      # The inbound webhook receivers (issue #54, S12-04): provider
      # senders retry on failure, so the burst bound sits well above
      # a healthy pipeline's delivery rate while still throttling an
      # abusive or mis-wired producer per client IP.
      webhooks:
        capacity: ${RATE_LIMIT_WEBHOOKS_CAPACITY:60}
        refill: ${RATE_LIMIT_WEBHOOKS_REFILL:PT1M}
  authorization-cache:
    # The decision-input cache (issue #32, S7-03): Redis-backed, above
    # the grant contributor and the effective-set resolution. Caches
    # INPUTS only — the grant set per tester x tenant, the membership
    # effectiveness flag, the tenant-application visibility flag, and
    # the tester's linked-tenant set — never decisions: the engine
    # still walks its layers and computes every evaluation. Write-
    # through invalidation fires inside every decision-affecting
    # mutation before commit; the TTL is the staleness backstop and
    # stays at or under the signed-URL TTL (both 15 min default, the
    # story's technical note).
    enabled: ${AUTHORIZATION_DECISION_CACHE_ENABLED:true}
    ttl: ${AUTHORIZATION_DECISION_CACHE_TTL:PT15M}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Forwarded-header trust (issue #39, S8-05): the platform always
  # runs behind a fronting proxy (compose nginx, Cloud Run's ingress,
  # later Dwara), so X-Forwarded-* is honored for link and redirect
  # generation. FRAMEWORK (Spring's ForwardedHeaderFilter, Google's
  # documented setting for Cloud Run) is the default rather than the
  # container-native valve: the valve rewrites the X-Forwarded-For
  # chain BEFORE any filter runs, which would hide the raw chain the
  # rate limiter's own trusted-side resolution reads — the rate
  # limiter additionally unwraps request wrappers, so its answer is
  # independent of where in the chain it runs.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

# Every log line of a request carries its correlation id (issue #6);
# '-' when off-request (startup, schedulers).
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    redis:
      # Deliberately off (issue #32, S7-03): the decision cache is a
      # performance layer whose absence the API survives by design
      # (fail-closed direct evaluation, the story's AC3), so Redis
      # availability is not an API health dependency — a down cache
      # must never page the on-call as an API outage. Cache health is
      # observable on the decision-cache outcome counter instead
      # (shipperdog.authorization.decision.cache, outcome=degraded).
      enabled: false
  tracing:
    sampling:
      # Baseline samples every request (issue #7, AC1); operators dial
      # this down with TRACING_SAMPLING_PROBABILITY once volume grows.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        # Histogram buckets for the HTTP server timer so latency SLOs
        # (PRD section 42) are computable in Prometheus (p95 et al).
        "[http.server.requests]": ${MANAGEMENT_METRICS_HTTP_HISTOGRAM:true}
        # Histogram buckets for the authorization decision timer so
        # the PRD 42 under-100 ms decision SLO is computable as p95 in
        # Prometheus (issue #32, S7-03, acceptance criterion 1 — the
        # authorization_decision_duration family; the RBAC and layered
        # legs share the meter, separated by the engine tag).
        "[shipperdog.authorization.decision.duration]": ${MANAGEMENT_METRICS_AUTHZ_HISTOGRAM:true}

---

spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
