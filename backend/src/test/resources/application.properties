# Test-scope overrides (issue #32, S7-03): the decision-input cache
# is OFF by default for the test suite so every pre-existing engine
# and grant test keeps its LIVE-query contract deterministically — a
# raw-SQL fixture mutation (the expired-grant legs) must reflect on
# the very next evaluation, which a cached set read would delay until
# the TTL. The cache's OWN tests (AuthorizationDecisionApiIntegration
# Test, AuthorizationDecisionDegradedIntegrationTest) re-enable it
# explicitly per class with a dedicated (or intentionally dead) Redis.
shipperdog.authorization-cache.enabled=false

# The in-app rate limiter (issue #39, S8-05) is OFF for the suite:
# every test client shares one 127.0.0.1 identity, so cross-class
# login traffic would trip the login bucket and make unrelated suites
# order-dependent. The limiter's OWN tests re-enable it per class
# with tight, dedicated limits.
shipperdog.ratelimit.enabled=false

# The notification relay's scheduled drains (issue #51, S12-01) are
# OFF for the suite: the notification tests drive the drain
# deterministically through the bean (the rollup-scheduler pattern,
# the analytics suite's precedent), and a background drain firing
# every two seconds would add scheduler and pool load that widens
# the suite's deliberate race windows (the device-registration and
# policy-hold concurrency tests) into flaky losses. The relay's OWN
# tests already disable it explicitly per class; production keeps the
# application.yml default (on, 2 s).
shipperdog.notifications.relay-enabled=false

# The webhook target policy's host and DNS checks (the SSRF posture,
# issue #51 review) are skipped suite-wide: the delivery suite POSTs
# to a local 127.0.0.1 receiver and the subscription suite uses
# non-resolving fixture hosts (hooks.example.test). The policy's OWN
# suite (NotificationWebhookTargetPolicyIntegrationTest) re-enables
# the checks per class and pins the rejections; production keeps the
# application.yml default (false -- publicly routable targets only).
shipperdog.notifications.webhook-allow-private-addresses=true
