# Test-scope overrides (issue #32, S7-03): the decision-input cache
# is OFF by default for the test suite so every pre-existing engine
# and grant test keeps its LIVE-query contract deterministically — a
# raw-SQL fixture mutation (the expired-grant legs) must reflect on
# the very next evaluation, which a cached set read would delay until
# the TTL. The cache's OWN tests (AuthorizationDecisionApiIntegration
# Test, AuthorizationDecisionDegradedIntegrationTest) re-enable it
# explicitly per class with a dedicated (or intentionally dead) Redis.
shipperdog.authorization-cache.enabled=false
