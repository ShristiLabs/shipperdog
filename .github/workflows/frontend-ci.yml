name: frontend-ci

# Console gate (issue #12) and, since issue #35, the tester portal's:
# lint, typecheck, build, and unit tests on every PR and main push,
# mirroring backend-ci. Each app is a single job on the Node 22 LTS
# image with npm caching — both gates run in about a minute so they
# never queue behind backend-ci. The portal is a separate app and
# bundle from the console; its job mirrors this one so neither app's
# gate can pass on the other's green.
on:
  pull_request:
    paths-ignore:
      - 'docs-site/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs-site/**'

jobs:
  lint-typecheck-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes strict typecheck)
        run: npm run build

      - name: Unit tests
        run: npm test

      # Dependency audit (issue #39, S8-05): the OSV scan job in
      # backend-ci covers lockfiles repo-wide; npm audit fails fast on
      # high/critical advisories at the app's own gate too.
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      # Bundle budget (issue #39, S8-05): the shipped hashed assets
      # stay under the ceiling (see scripts/check-bundle-size.mjs).
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

  portal-lint-typecheck-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes strict typecheck)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

      # Security-header gate (issue #39, S8-05): builds the portal
      # image exactly as deployed and asserts the
      # securityheaders.com-grade header set. Docker is on the runner;
      # the script never touches the network beyond the local
      # container (the api upstream is stub-resolved).
      - name: Security header check (deployed image)
        working-directory: .
        run: infrastructure/security-headers/check-portal-headers.sh

