name: deploy

# The M1 deploy pipeline (issue #39, S8-05): manual dispatch builds
# the two images, pushes them to Artifact Registry, applies the
# terraform stack (infrastructure/terraform — Cloud Run with managed
# TLS, private Cloud SQL/Redis, uptime checks), and runs the
# post-deploy smoke test against the live URLs. Never runs on pull
# requests; the PR-relevant gates (terraform validate, header check,
# dependency scans) live in backend-ci/frontend-ci.
#
# Required repository secrets (docs/deployment.md has the full setup):
#   GCP_WIF_PROVIDER      — workload identity federation provider
#   GCP_SERVICE_ACCOUNT   — the deploy service account's email
#   GCP_PROJECT_ID        — target project
#   TF_AUTH_JWT_SECRET    — >= 32-byte JWT signing key (tf var)
#   TF_DOWNLOAD_SIGNING_KEY — download-proxy HMAC key (tf var)
#   TF_DB_PASSWORD        — app database password (tf var; optional —
#                           terraform generates one when absent)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # workload identity federation
      contents: read
    env:
      REGION: us-central1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Resolve image coordinates
        id: images
        run: |
          SHA="${GITHUB_SHA::12}"
          REPO="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/shipperdog"
          echo "api=${REPO}/api:${SHA}" >> "$GITHUB_OUTPUT"
          echo "portal=${REPO}/portal:${SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        run: docker build -t "${{ steps.images.outputs.api }}" backend && docker push "${{ steps.images.outputs.api }}"

      - name: Build and push portal image
        run: docker build -t "${{ steps.images.outputs.portal }}" portal && docker push "${{ steps.images.outputs.portal }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_api_image: ${{ steps.images.outputs.api }}
          TF_VAR_portal_image: ${{ steps.images.outputs.portal }}
          TF_VAR_auth_jwt_secret: ${{ secrets.TF_AUTH_JWT_SECRET }}
          TF_VAR_artifact_download_proxy_signing_key: ${{ secrets.TF_DOWNLOAD_SIGNING_KEY }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve -input=false

      - name: Post-deploy smoke test (health, login, catalog)
        working-directory: infrastructure/terraform
        run: |
          API_URL="$(terraform output -raw api_url)"
          PORTAL_URL="$(terraform output -raw portal_url)"
          cd ../.. && \
          API_BASE_URL="$API_URL" PORTAL_BASE_URL="$PORTAL_URL" \
          infrastructure/smoke/smoke.sh
