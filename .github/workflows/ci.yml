name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, format-check, and test
        run: mvn -B -ntp verify

      # Issue #8: the OpenAPI contract is generated from code by the
      # export test during verify; publish it so consumers (frontend,
      # CLI, CI) can wire against the exact served contract.
      - name: Publish generated OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/target/openapi.yaml
          if-no-files-found: error

      # Breaking-change gate (issue #8): diff the freshly generated spec
      # against the committed baseline. A breaking change must be a
      # conscious re-baseline in the same PR, never an accident.
      - name: Check OpenAPI contract for breaking changes
        working-directory: .
        env:
          OASDIFF_VERSION: '1.33.0'
        run: |
          curl -sSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oasdiff
          oasdiff breaking docs/openapi/baseline.yaml backend/target/openapi.yaml

  # Dependency vulnerability gate (issue #39, S8-05): OSV scan of every
  # dependency surface in the repo (backend pom, both npm lockfiles, the
  # Go module), failing on high/critical findings. The backend's
  # resolved transitive graph is the risk — the scan reads the pom and
  # resolves transitives through deps.dev, so the gate sees what ships.
  dependency-scan:
    runs-on: ubuntu-latest
    env:
      OSV_VERSION: '2.6.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan backend (pom with transitive resolution)
        run: |
          osv-scanner scan source --format json backend \
            | python3 infrastructure/dependency-scan/osv_severity_gate.py

      - name: Scan console, portal, and CLI lockfiles
        run: |
          osv-scanner scan source --format json frontend portal cli \
            | python3 infrastructure/dependency-scan/osv_severity_gate.py

  # Terraform gate (issue #39, S8-05): format check and validation of
  # the Cloud Run deployment config. validate with -backend=false
  # needs no GCP credentials (providers download, no APIs are called),
  # so every PR proves the IaC is at least well-formed.
  terraform-fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend) and validate
        run: |
          terraform init -backend=false
          terraform validate
