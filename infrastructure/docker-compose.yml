name: shipperdog

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipperdog}
      POSTGRES_USER: ${POSTGRES_USER:-shipperdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipperdog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipperdog} -d ${POSTGRES_DB:-shipperdog}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-host", "0.0.0.0", "-port", "4443"]
    ports:
      - "${GCS_EMULATOR_PORT:-4443}:4443"

  api:
    build:
      context: ../backend
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shipperdog}
      DATABASE_USERNAME: ${POSTGRES_USER:-shipperdog}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-shipperdog}
      # Local-only HMAC key for JWT signing, same policy as the local-only
      # database password above. Production must inject a real secret.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-shipperdog-local-dev-jwt-secret-0123456789abcdef}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GCS_EMULATOR_ENDPOINT: http://gcs-emulator:4443
      # Observability baseline (issue #7): all management endpoints move
      # to the internal management port, which is published to the host
      # loopback only — /actuator/health and /actuator/prometheus are
      # reachable for the operator and the Prometheus service, never on
      # the public API port. Traces export nowhere unless an OTLP
      # endpoint is set (OTEL_EXPORTER_OTLP_TRACES_ENDPOINT).
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_ENDPOINTS_EXPOSE: health,info,prometheus
      OTEL_SERVICE_NAME: shipperdog-api
      # Structured JSON logs with correlation id, trace id, and span id.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gcs-emulator:
        condition: service_started

  prometheus:
    # Scrapes the API's internal management port over the compose
    # network (api:8081); the UI is loopback-only for the operator.
    image: prom/prometheus:v3.7.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    # Dashboard skeleton (issue #7): request rate, error rate, p95
    # latency. Admin/admin by default — local-only, loopback-bound.
    image: grafana/grafana-oss:12.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
