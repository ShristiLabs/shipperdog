name: shipperdog

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipperdog}
      POSTGRES_USER: ${POSTGRES_USER:-shipperdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipperdog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipperdog} -d ${POSTGRES_DB:-shipperdog}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.56.1
    # -external-url (issue #20): the emulator advertises this host in
    # the resumable-session URLs it grants — the API reaches it at
    # gcs-emulator:4443 over the compose network, but the CLIENT that
    # streams direct-to-storage bytes runs on the operator's machine,
    # so the advertised URL must be host-reachable.
    command:
      ["-scheme", "http", "-host", "0.0.0.0", "-port", "4443", "-external-url", "${GCS_EXTERNAL_URL:-http://localhost:4443}"]
    ports:
      - "${GCS_EMULATOR_PORT:-4443}:4443"

  # Direct-to-storage session URLs (S5-01/S5-06): fake-gcs-server
  # builds the resumable session Location from the REQUEST Host header
  # (its -external-url does not apply there), so the API must dial the
  # emulator as "localhost:4443" for the URLs it hands the CLI to be
  # reachable from the operator's machine. This forwarder shares the
  # API's network namespace and bridges localhost:4443 to the emulator
  # service (issue #25; upstream behavior at fsouza/fake-gcs-server
  # v1.56.1, internal/urlhelper).
  gcs-forward:
    image: alpine/socat:1.8.1.3
    network_mode: service:api
    command: "tcp-listen:4443,fork,reuseaddr tcp:gcs-emulator:4443"
    depends_on:
      - api
      - gcs-emulator

  api:
    build:
      context: ../backend
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shipperdog}
      DATABASE_USERNAME: ${POSTGRES_USER:-shipperdog}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-shipperdog}
      # Local-only HMAC key for JWT signing, same policy as the local-only
      # database password above. Production must inject a real secret.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-shipperdog-local-dev-jwt-secret-0123456789abcdef}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GCS_EMULATOR_ENDPOINT: http://localhost:4443
      # Artifact object storage (issue #20, ADR-0003): the API reaches
      # the emulator through the localhost forwarder (gcs-forward) so
      # the direct-to-storage session URLs it grants carry the
      # operator-reachable published port. Production points
      # ARTIFACT_STORAGE_EMULATOR_HOST at real GCS credentials instead
      # (blank host = application default credentials).
      ARTIFACT_STORAGE_EMULATOR_HOST: http://localhost:4443
      ARTIFACT_STORAGE_BUCKET: ${ARTIFACT_STORAGE_BUCKET:-shipperdog-artifacts-local}
      # Observability baseline (issue #7): all management endpoints move
      # to the internal management port, which is published to the host
      # loopback only — /actuator/health and /actuator/prometheus are
      # reachable for the operator and the Prometheus service, never on
      # the public API port. Traces export nowhere unless an OTLP
      # endpoint is set (OTEL_EXPORTER_OTLP_TRACES_ENDPOINT).
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_ENDPOINTS_EXPOSE: health,info,prometheus
      OTEL_SERVICE_NAME: shipperdog-api
      # Structured JSON logs with correlation id, trace id, and span id.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gcs-emulator:
        condition: service_started

  # Admin console (issue #12): the built SPA served by nginx, proxying
  # /api to the api service over the compose network so the browser
  # treats the console and the API as one origin. Port 5173 mirrors the
  # Vite dev server; Grafana keeps 3000.
  frontend:
    build:
      context: ../frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

  # Tester portal (issue #35): a SEPARATE app and container from the
  # console — testers never load admin routes (issue AC1/AC5). Same
  # nginx /api proxying pattern; port 5174 mirrors the portal's Vite
  # dev server, and the API's invitation links point here
  # (TESTER_PORTAL_BASE_URL).
  portal:
    build:
      context: ../portal
    ports:
      - "${PORTAL_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_started

  prometheus:
    # Scrapes the API's internal management port over the compose
    # network (api:8081); the UI is loopback-only for the operator.
    image: prom/prometheus:v3.7.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    # Dashboard skeleton (issue #7): request rate, error rate, p95
    # latency. Admin/admin by default — local-only, loopback-bound.
    image: grafana/grafana-oss:12.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
