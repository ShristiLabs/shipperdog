# Grafana dashboard provisioning (issue #7): dashboards load from the
# directory mounted in docker compose, no manual import.
apiVersion: 1

providers:
  - name: shipperdog
    orgId: 1
    folder: ShipperDog
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
